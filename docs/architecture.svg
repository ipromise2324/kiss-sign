<line class="conn" x1="174.0" y1="406.0" x2="174.0" y2="464.0" marker-end="url(#arr)"/>
<line class="conn" x1="174.0" y1="532.0" x2="174.0" y2="563.0" marker-end="url(#arr)"/>
<line class="conn" x1="174.0" y1="631.0" x2="174.0" y2="662.0" marker-end="url(#arr)"/>
<line class="conn" x1="174.0" y1="730.0" x2="174.0" y2="761.0" marker-end="url(#arr)"/>
<line class="conn" x1="174.0" y1="829.0" x2="174.0" y2="851.0" marker-end="url(#arr)"/>
<line class="conn" x1="174.0" y1="1097.0" x2="174.0" y2="1119.0" marker-end="url(#arr)"/>
<line class="conn" x1="174.0" y1="1187.0" x2="174.0" y2="1227.0" marker-end="url(#arr)"/>
<line class="conn" x1="174.0" y1="1295.0" x2="174.0" y2="1335.0" marker-end="url(#arr)"/>
<path class="side" d="M64 887.0 H34 V1263.0 H60" marker-end="url(#arr2)"/><text class="sidelbl" transform="translate(28 1075.0) rotate(-90)" text-anchor="middle">saved template</text></svg>
