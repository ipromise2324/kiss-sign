# Dependabot waits seven days after a release, as pnpm's minimumReleaseAge does, before it proposes an update.
# A dependency update still pins its files first (node scripts/pin-packages.ts), in a program pull request.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # @types/node follows the oldest Node that package.json's engines allows; raise both together by hand.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
