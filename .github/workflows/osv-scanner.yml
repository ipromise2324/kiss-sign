name: osv-scanner

# A second source beside Dependabot's alerts: OSV-Scanner checks pnpm-lock.yaml against the OSV database.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  scan:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      runs-on: ubuntu-24.04
      scan-args: |-
        --lockfile=pnpm-lock.yaml
