name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # fetch-solc checks every file's sha256 against its pin, so a restored cache is checked like a download.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/solc
          key: solc-${{ hashFiles('src/contracts/solc-pins.ts') }}
      - run: pnpm fetch-solc
      - run: pnpm fetch-psl
      - run: pnpm typecheck
      # Test-only solc outputs, each keyed by the pinned build's sha256 and the exact input; every proof still compares with the code on chain.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/solc-test
          key: solc-test-${{ hashFiles('src/contracts/solc-pins.ts', 'testdata/abi/**', 'registry/**', 'templates/**') }}
          restore-keys: solc-test-
      - run: pnpm test
        env:
          SOLC_TEST_CACHE: '1'

  verdict-core-apart:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      # Refuses a branch that changes the verdict core and templates/ or registry/ together.
      - run: node scripts/check-push.ts origin/main..HEAD
